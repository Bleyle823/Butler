# Chest service deck for ButlerServe. Same TIAGo body paint, brushed aluminium
# wells, and black internals as the robot. Recessed cups plus a 45 mm rim keep
# plates, glasses, and the pizza box from sliding off during drive.
# Mates with TiagoBody frontArmSlot (type "tiago front arm").

EXTERNPROTO "../assets/webots/projects/appearances/protos/GlossyPaint.proto"
EXTERNPROTO "../assets/webots/projects/appearances/protos/BrushedAluminium.proto"
EXTERNPROTO "../assets/webots/projects/appearances/protos/MattePaint.proto"

PROTO ButlerTray [
  field  SFVec3f     translation    0.04 0.32 -0.22
  field  SFRotation  rotation       0 0 1 1.5708
  field  SFString    name           "butler tray"
  field  SFNode      plateSlot      NULL
  field  SFNode      glassSlot      NULL
  field  SFNode      wineglassSlot  NULL
  field  SFNode      boxSlot        NULL
]
{
  Slot {
    type "tiago front arm"
    endPoint Solid {
      translation IS translation
      rotation IS rotation
      name IS name
      children [
        # Torso column clamp (body paint)
        Pose {
          translation -0.16 0 -0.03
          children [
            Shape {
              appearance DEF TIAGO_BODY GlossyPaint {
                baseColor 0.823529 0.776471 0.776471
                textureTransform TextureTransform {
                  scale 4 4
                }
                IBLStrength 1.8
              }
              geometry Box {
                size 0.12 0.1 0.06
              }
            }
          ]
        }
        Pose {
          translation -0.22 0 -0.1
          children [
            Shape {
              appearance USE TIAGO_BODY
              geometry Box {
                size 0.06 0.1 0.18
              }
            }
          ]
        }
        # Underside (TIAGo black internals)
        Pose {
          translation 0.02 0 -0.012
          children [
            Shape {
              appearance MattePaint {
                baseColor 0.133333 0.133333 0.133333
              }
              geometry Box {
                size 0.42 0.32 0.01
              }
            }
          ]
        }
        # Deck
        Pose {
          children [
            Shape {
              appearance USE TIAGO_BODY
              geometry Box {
                size 0.42 0.32 0.016
              }
            }
          ]
        }
        # Outer rim: four walls, 45 mm above the deck
        Pose {
          translation 0 0.154 0.03
          children [
            Shape {
              appearance USE TIAGO_BODY
              geometry Box {
                size 0.42 0.012 0.045
              }
            }
          ]
        }
        Pose {
          translation 0 -0.154 0.03
          children [
            Shape {
              appearance USE TIAGO_BODY
              geometry Box {
                size 0.42 0.012 0.045
              }
            }
          ]
        }
        Pose {
          translation 0.204 0 0.03
          children [
            Shape {
              appearance USE TIAGO_BODY
              geometry Box {
                size 0.012 0.308 0.045
              }
            }
          ]
        }
        Pose {
          translation -0.204 0 0.03
          children [
            Shape {
              appearance USE TIAGO_BODY
              geometry Box {
                size 0.012 0.308 0.045
              }
            }
          ]
        }
        # TIAGo bumper-orange front lip (anti-spill when braking)
        Pose {
          translation 0.21 0 0.028
          children [
            Shape {
              appearance PBRAppearance {
                baseColor 1 0.552941 0.184314
                roughness 0.35
                metalness 0
              }
              geometry Box {
                size 0.008 0.3 0.04
              }
            }
          ]
        }
        # Recessed aluminium wells
        Pose {
          translation 0.06 0.07 0.01
          children [
            Shape {
              appearance DEF WELL BrushedAluminium {
                IBLStrength 1.4
              }
              geometry Cylinder {
                height 0.01
                radius 0.062
              }
            }
            Slot {
              type "butler plate"
              endPoint IS plateSlot
            }
          ]
        }
        Pose {
          translation -0.1 0.08 0.012
          children [
            Shape {
              appearance USE WELL
              geometry Cylinder {
                height 0.018
                radius 0.032
              }
            }
            Slot {
              type "butler glass"
              endPoint IS glassSlot
            }
          ]
        }
        Pose {
          translation -0.1 -0.08 0.012
          children [
            Shape {
              appearance USE WELL
              geometry Cylinder {
                height 0.018
                radius 0.03
              }
            }
            Slot {
              type "butler wineglass"
              endPoint IS wineglassSlot
            }
          ]
        }
        Pose {
          translation 0.05 -0.07 0.012
          children [
            GPS {
              translation 0 0 0.04
              name "tray well"
            }
            Shape {
              appearance USE WELL
              geometry Box {
                size 0.24 0.18 0.016
              }
            }
            Slot {
              type "butler box"
              endPoint IS boxSlot
            }
          ]
        }
        # Raised well collars (rings sit under the outer rim, cups stay open)
        Pose {
          translation 0.06 0.132 0.028
          children [
            Shape {
              appearance USE TIAGO_BODY
              geometry Box {
                size 0.13 0.012 0.022
              }
            }
          ]
        }
        Pose {
          translation 0.06 0.008 0.028
          children [
            Shape {
              appearance USE TIAGO_BODY
              geometry Box {
                size 0.13 0.012 0.022
              }
            }
          ]
        }
        Pose {
          translation -0.1 0.08 0.03
          children [
            Shape {
              appearance USE TIAGO_BODY
              geometry Box {
                size 0.01 0.07 0.028
              }
            }
          ]
        }
        Pose {
          translation -0.1 -0.08 0.03
          children [
            Shape {
              appearance USE TIAGO_BODY
              geometry Box {
                size 0.01 0.07 0.028
              }
            }
          ]
        }
      ]
      boundingObject Group {
        children [
          Pose {
            translation 0 0 0
            children [
              Box {
                size 0.42 0.32 0.016
              }
            ]
          }
          Pose {
            translation 0 0.154 0.03
            children [
              Box {
                size 0.42 0.012 0.045
              }
            ]
          }
          Pose {
            translation 0 -0.154 0.03
            children [
              Box {
                size 0.42 0.012 0.045
              }
            ]
          }
          Pose {
            translation 0.204 0 0.03
            children [
              Box {
                size 0.012 0.308 0.045
              }
            ]
          }
          Pose {
            translation -0.204 0 0.03
            children [
              Box {
                size 0.012 0.308 0.045
              }
            ]
          }
        ]
      }
      physics Physics {
        density -1
        mass 1.4
      }
    }
  }
}
