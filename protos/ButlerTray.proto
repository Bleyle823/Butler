# Chest tray for ButlerServe. Mates with TiagoBody frontArmSlot (type "tiago front arm").
# Offset puts the plate in front of the torso column, not on the unused third-arm shoulder.
# Item fields take a Plate, Glass, Wineglass, or CardboardBox. Empty wells stay visible.

